{% extends "base.html" %}
{% block title %}Log in · MiniBank{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <p class="auth-brand">MiniBank</p>
  <p class="auth-sub">Sign in to your account</p>

  <form method="post">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
    </div>
    <label class="checkbox-field">
      <input type="checkbox" name="remember" value="1">
      Remember me on this device
    </label>
    <button class="btn" type="submit" style="width:100%">Log in</button>
  </form>

  <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  <p class="auth-switch"><a href="{{ url_for('admin_login') }}">Site admin</a></p>
</div>
{% endblock %}
